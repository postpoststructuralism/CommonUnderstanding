name: Deploy to Azure

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: common-understanding-v2
  AZURE_RESOURCE_GROUP: CommonUnderstanding
  DOTNET_VERSION: '9.0.x'

# Never retain artifacts — clean up immediately after deployment
defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore CommonUnderstanding/CommonUnderstanding.csproj

    - name: Build
      run: dotnet build CommonUnderstanding/CommonUnderstanding.csproj --configuration Release --no-restore

    - name: Publish
      run: |
        rm -rf publish
        dotnet publish CommonUnderstanding/CommonUnderstanding.csproj -c Release -o ./publish --no-build

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Configure Linux runtime
      run: |
        az webapp config set \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --linux-fx-version "DOTNETCORE|9.0"

    - name: Configure app settings
      run: |
        az webapp config appsettings set \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --settings \
            ASPNETCORE_ENVIRONMENT=Production

    - name: Deploy to Azure Web App
      run: |
        rm -f deploy.zip
        test -f publish/CommonUnderstanding.dll
        if find publish -mindepth 1 -type d \( -name artifacts -o -name bin -o -name obj -o -name publish \) -print -quit | grep -q .; then
          echo "Generated directory found in publish output"
          exit 1
        fi
        cd publish
        zip -r -q ../deploy.zip .
        cd ..
        if unzip -Z1 deploy.zip | grep -q '\\'; then
          echo "ZIP contains backslash entry names"
          exit 1
        fi
        if unzip -Z1 deploy.zip | grep -E '(^|/)(artifacts|bin|obj|publish)(/|$)'; then
          echo "ZIP contains generated directories"
          exit 1
        fi
        unzip -t deploy.zip
        az webapp deploy \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --src-path deploy.zip \
          --type zip \
          --clean true \
          --restart true \
          --async false

    - name: Cleanup
      if: always()
      run: |
        rm -f deploy.zip
        rm -rf publish
